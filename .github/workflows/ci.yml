name: AssetChain Continuous Integration Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  smart-contracts-build:
    name: Build & Verify Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Compile Hardhat Solidity Contracts
        run: |
          cd contracts
          npx hardhat compile

  backend-server-tests:
    name: Run Backend Server Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Test Suite
        env:
          PORT: 3001
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_min_32_characters_long
        run: |
          cd server
          npm test

